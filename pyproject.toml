[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csorchestrator"
version = "0.1.0"
description = "orchestrator for projects config, build, deployment"
authors = [
  { name = "cscosine-dev", email = "cscosine@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "GitPython>=3.1",
    "PyYAML>=6.0",
    "click>=8.1",
    "colorama>=0.4.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
csorchestrator = "csorchestrator.application.cli.cli:main"

[project.optional-dependencies]
# development tools (tests, linting, type checking)
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "mypy>=1.0",
    "ruff>=0.4",
    "pre-commit>=4",
    "import-linter[ui]>=2.0",
    "types-PyYAML",
]

# ===============================
# Ruff - Linter + Formatter
# ===============================
[tool.ruff]

# Maximum allowed line length for linting.
line-length = 120

# Target Python version for rule selection / parsing.
target-version = "py311"

[tool.ruff.lint]
# Enabled rule groups:
# E  -> Pycodestyle errors (style issues)
# F  -> Pyflakes (logical errors / unused imports)
# I  -> Import sorting
# B  -> Bugbear (common bug patterns)
# UP -> modern Python suggestions
# SIM -> catches simplifications
# N  -> PEP8 naming conventions
# C4 -> flake8-comprehensions (more Pythonic comprehensions)
# W  -> Pycodestyle warnings
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "N",
    "C4",
    "W",
]

[tool.ruff.format]
# Force double quotes in formatted code.
# This keeps formatting consistent across the project.
quote-style = "double"

# ===============================
# MyPy - Static Type Checker
# ===============================
[tool.mypy]
mypy_path = "src"

# Python version used for type checking.
python_version = "3.11"

# Enables strict type checking mode.
# This makes mypy behave like a production-grade type checker.
# It enables:
# - No implicit Any
# - Strict optional checks
# - Unused ignore detection
strict = true

# Ignore missing type hints in third-party libraries.
# Many libraries don't ship with typing, so this avoids noise.
ignore_missing_imports = true

# Treat src/ as a real package root. Do not auto-guess.
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false

# ===============================
# pytest - test execution
# ===============================

[tool.pytest.ini_options]

markers = [
  "slow: slow tests",
  "git: requires git access to a remote repo",
  "requires: test requires external tool or dependency (e.g. `requires(\"clang++\")` )",
]

testpaths = [
    "tests"
]

pythonpath = [
    "src"
]

addopts = [
    "-ra",
    "--strict-markers"
]

# ===============================
# coverage
# ===============================

[tool.coverage.run]
branch = true
source = [
    "csorchestrator"
]

[tool.coverage.report]
show_missing = true
# fail_under = 70 # TODO keep fail disabled for now

# ===============================
# import linter
# ===============================

[tool.importlinter]
root_package = "csorchestrator"

[[tool.importlinter.contracts]]
name = "high level layers"
type = "layers"

layers = [
    "application",
    "frontend",
    "domain",
    "foundation",
    "portable",
]
containers = [
    "csorchestrator"
]
exhaustive = true

[[tool.importlinter.contracts]]
name = "foundation layers"
type = "layers"

layers = [
    "file_system | git",
    "core"
]
containers = [
    "csorchestrator.foundation"
]
exhaustive = true

[[tool.importlinter.contracts]]
name = "domain layers"
type = "layers"

layers = [
    "execution",
    "context",
    "orchestrator"
]
containers = [
    "csorchestrator.domain"
]
exhaustive = true

[[tool.importlinter.contracts]]
name = "frontend layers"
type = "layers"

layers = [
    "step",
    "cscmake_presets",
    "github_workflow_translation : local_execution",
    "validation",
    "reporters"
]
containers = [
    "csorchestrator.frontend"
]
exhaustive = true

[[tool.importlinter.contracts]]
name = "application layers"
type = "layers"

layers = [
    "cli",
    "recipes",
    "factory"
]
containers = [
    "csorchestrator.application"
]
exhaustive = true
