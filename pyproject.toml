# Mixed file. Owned by the project: [project] and its sub-tables, [tool.setuptools], and every table after the
# "project" marker at the end. Owned by the project template (cs-project-template, change it there): [build-system]
# and the tables between the "template" markers. Never edit a template line here: `copier update` keeps the project
# lines and replaces the template ones.

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csorchestrator"
version = "0.1.0"
description = "orchestrator for projects config, build, deployment"
authors = [
  { name = "cscosine-dev", email = "cscosine@gmail.com" }
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "GitPython>=3.1",
    "PyYAML>=6.0",
    "click>=8.1",
    "colorama>=0.4.6",
]

[project.scripts]
csorchestrator = "csorchestrator.application.cli.cli:main"

[project.optional-dependencies]
dev = [
    # template: the tools of .pre-commit-config.yaml and the tests
    "pytest>=9",
    "pytest-cov>=7",
    "mypy>=1.20",
    "ruff>=0.4",
    "pre-commit>=4",
    "import-linter[ui]>=2.11",
    "types-PyYAML",
    # project: below
]

[tool.setuptools.packages.find]
where = ["src"]

# === template: begin =================================================================================================

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E, W: pycodestyle; F: pyflakes; I: import sorting; B: bugbear; UP: pyupgrade; SIM: simplifications;
# N: PEP 8 naming; C4: comprehensions
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
mypy_path = "src"

# csorchestrator workspace
exclude = "^workspace/"
python_version = "3.11"
# strict: no implicit Any, strict optional, unused ignores reported
strict = true
# third-party libraries without type hints
ignore_missing_imports = true
# src/ is the package root: no guessing
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false

[tool.pytest.ini_options]
# markers and the --run-* options: conftest.py
testpaths = ["tests"]
norecursedirs = ["workspace", "*.egg-info", ".git", "__pycache__"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]

# === template: end ===================================================================================================

# --- project ---

# ===============================
# coverage
# ===============================

[tool.coverage.run]
branch = true
source = [
    "csorchestrator"
]

[tool.coverage.report]
show_missing = true
# fail_under = 70 # TODO keep fail disabled for now

# ===============================
# import linter
# ===============================

[tool.importlinter]
root_package = "csorchestrator"

[[tool.importlinter.contracts]]
name = "high level layers"
type = "layers"

layers = [
    "application",
    "frontend",
    "domain",
    "foundation",
    "portable",
]
containers = [
    "csorchestrator"
]
exhaustive = true

[[tool.importlinter.contracts]]
name = "foundation layers"
type = "layers"

layers = [
    "file_system | git",
    "core"
]
containers = [
    "csorchestrator.foundation"
]
exhaustive = true

[[tool.importlinter.contracts]]
name = "domain layers"
type = "layers"

layers = [
    "execution",
    "context",
    "orchestrator"
]
containers = [
    "csorchestrator.domain"
]
exhaustive = true

[[tool.importlinter.contracts]]
name = "frontend layers"
type = "layers"

layers = [
    "step",
    "cscmake_presets",
    "github_workflow_translation : local_execution",
    "validation",
    "reporters"
]
containers = [
    "csorchestrator.frontend"
]
exhaustive = true

[[tool.importlinter.contracts]]
name = "application layers"
type = "layers"

layers = [
    "cli",
    "recipes",
    "factory"
]
containers = [
    "csorchestrator.application"
]
exhaustive = true
