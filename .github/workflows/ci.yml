name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, dev ]

jobs:
  checks:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        deps: ["latest"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            deps: "minimum"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"  # ✅ built-in pip cache
          cache-dependency-path: |
            pyproject.toml
            setup.cfg
            requirements*.txt
            constraints-minimum.txt

      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.deps }}" = "minimum" ]; then
            pip install -e .[dev] -c constraints-minimum.txt
          else
            pip install -e .[dev]
          fi
        shell: bash

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Run tests with coverage
        env:
          ACTIONS_ORG_ACCESS: ${{ secrets.ACTIONS_ORG_ACCESS }}
        run: |
          pytest \
            --run-all \
            --log-cli-level=INFO \
            --cov=csorchestrator \
            --cov-branch \
            --cov-report=xml:coverage-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}.xml \
            --cov-report=html:htmlcov-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }} \
            --cov-report=term-missing \
            | tee coverage-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}.txt
        shell: bash

      - name: Upload coverage HTML as artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-html-${{ matrix.os }}-py${{ matrix.python-version }}-${{ matrix.deps }}
          path: htmlcov-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}

      - name: Add coverage to summary
        run: |
          {
            echo "## 🧪 Coverage (${{ matrix.os }} / Python ${{ matrix.python-version }} / ${{ matrix.deps }})"
            echo ""
            echo '```'
            cat "coverage-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.deps }}.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        shell: bash
